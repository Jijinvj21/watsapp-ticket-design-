<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Ticket Design</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500&display=swap');

    body {
      background-color: #2D2D2D;
      /* Dark background to contrast the ticket */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Inter', sans-serif;
      box-sizing: border-box;
    }

    * {
      box-sizing: border-box;
    }

    .ticket-wrapper {
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.2));
    }

    .ticket {
      width: 366px;
      display: flex;
      flex-direction: column;
      border-radius: 24px;
      background-color: transparent;
    }

    .ticket-top {
      flex: 1;
      padding: 40px 32px 20px 32px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      position: relative;
      background:
        radial-gradient(circle at 0 calc(100% - 36px), white 14px, #F4F6FB 14.5px) bottom left / 51% 100% no-repeat,
        radial-gradient(circle at 100% calc(100% - 36px), white 14px, #F4F6FB 14.5px) bottom right / 51% 100% no-repeat;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: linear-gradient(90deg, #EFF6FF 0%, #FAF5FF 100%);
      border: 1px solid rgba(190, 219, 255, 0.4);
      /* #BEDBFF at 40% opacity */
      padding: 6px 14px;
      border-radius: 100px;
      /* Ensures perfect pill shape */
      font-family: 'Outfit', sans-serif;
      font-weight: 400;
      font-style: normal;
      font-size: 12px;
      line-height: 16px;
      letter-spacing: 0.3px;
      color: #1E293B;
      width: 139px;
      height: 30px;
    }

    .badge svg {
      width: 14px;
      height: 14px;
      color: #3B82F6;
    }

    .profile-btn {
      width: 20px;
      height: 20px;
      color: #90A1B9;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .profile-btn svg {
      width: 20px;
      height: 20px;
    }

    .event-details-block {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .event-title {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 500;
      font-style: normal;
      color: #0F172A;
      line-height: 35px;
      margin: 0;
      letter-spacing: -0.32px;
    }

    .event-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Outfit', sans-serif;
      font-weight: 400;
      font-style: normal;
      font-size: 14px;
      line-height: 20px;
      letter-spacing: -0.15px;
      color: #45556C;
    }

    .event-info-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .event-info-item svg {
      width: 16px;
      height: 16px;
    }

    .dot-separator {
      width: 4px;
      height: 4px;
      background-color: #CBD5E1;
      border-radius: 50%;
    }

    .team-name-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }

    .team-label {
      font-family: 'Outfit', sans-serif;
      font-weight: 400;
      font-style: normal;
      font-size: 24px;
      line-height: 32px;
      letter-spacing: -0.53px;
      color: #0F172A;
      margin: 0;
    }

    .category-tag {
      display: inline-block;
      background-color: #F1F5F9;
      border: 1px solid rgba(226, 232, 240, 0.6);
      padding: 6px 16px;
      border-radius: 20px;
      font-family: 'Outfit', sans-serif;
      font-weight: 400;
      font-style: normal;
      font-size: 14px;
      line-height: 20px;
      letter-spacing: -0.15px;
      color: #334155;
    }

    .qr-block {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .qr-wrapper {
      background-color: #FFFFFF;
      border-radius: 16px;
      padding: 12px;
      width: 180px;
      height: 180px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .qr-code {
      width: 100%;
      height: 100%;
    }

    .booking-ref {
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-style: normal;
      font-size: 14px;
      line-height: 20px;
      letter-spacing: 0.2px;
      color: #62748E;
    }

    .booking-ref span {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-style: normal;
      font-size: 14px;
      line-height: 20px;
      letter-spacing: 0.2px;
      color: #314158;
    }

    .ticket-bottom {
      height: 113px;
      padding: 0 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      background:
        radial-gradient(circle at 0 36px, white 14px, transparent 14.5px) top left / 51% 100% no-repeat,
        radial-gradient(circle at 100% 36px, white 14px, transparent 14.5px) top right / 51% 100% no-repeat,
        linear-gradient(90deg, #0469D4 0%, #002750 97.54%);
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
    }

    .ticket-bottom::before {
      content: '';
      position: absolute;
      top: 0;
      left: 14px;
      right: 14px;
      border-top: 1px dashed rgba(255, 255, 255, 0.2);
    }

    .booked-text {
      font-family: 'Outfit', sans-serif;
      font-weight: 400;
      font-style: normal;
      font-size: 12px;
      leading-trim: none;
      line-height: 16px;
      letter-spacing: 0.3px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 6px;
    }

    .logo-image {
      width: 85.74220275878906px;
      height: 24px;
      opacity: 1;
      transform: rotate(0deg);
      object-fit: contain;
    }
  </style>
</head>

<body>
  <div class="ticket-wrapper">
    <div class="ticket">
      <div class="ticket-top">
        <div class="header-row">
          <div class="badge">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z" />
            </svg>
            Exclusive Pass
          </div>
          <button class="profile-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </button>
        </div>

        <div class="event-details-block">
          <h1 class="event-title">One8 Presents No<br>Parking by peakst8</h1>
          <div class="event-info">
            <div class="event-info-item">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
              20 Jun 2026
            </div>
            <div class="dot-separator"></div>
            <div class="event-info-item">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
              Delhi
            </div>
          </div>
        </div>

        <div class="team-name-block">
          <h2 class="team-label">Team Name</h2>
          <div class="category-tag">Category</div>
        </div>

        <div class="qr-block">
          <div class="qr-wrapper">
            <img
              src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=VCX12345&color=0f172a&bgcolor=ffffff&margin=0"
              alt="QR Code" class="qr-code">
          </div>
          <div class="booking-ref">
            Booking Ref: <span>VCX12345</span>
          </div>
        </div>
      </div>

      <div class="ticket-bottom">
        <div class="booked-text">Ticket booked on</div>
        <img src="Container.png" alt="peakst8" class="logo-image">
      </div>
    </div>
  </div>
</body>

</html>
